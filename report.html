<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀러닝 최종 보고 — 사교원 사회혁신팀러닝</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --green:#4a6741; --green-dark:#395032; --green-pale:#eef2ec;
  --ink:#2b2b28; --sub:#6b6b64; --line:#e3e1da; --bg:#f7f6f2; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
.serif{font-family:'Noto Serif KR','Pretendard',serif}
a{color:var(--green);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

header{background:var(--green);color:#fff;padding:14px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;font-size:1rem}
.brand a{color:#fff}
header .no-print a{color:#fff;opacity:.85;font-size:.85rem}

.cover{background:linear-gradient(160deg,var(--green) 0%,var(--green-dark) 100%);color:#fff;padding:50px 0 46px;text-align:center}
.cover .label{font-size:.8rem;letter-spacing:.25em;opacity:.8}
.cover h1{font-size:1.7rem;font-weight:800;margin-top:12px}
.cover .team{margin-top:10px;font-size:.95rem;opacity:.92}
.cover .date{margin-top:4px;font-size:.8rem;opacity:.7}

.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:38px 36px;margin:26px auto 40px}
.md p{margin:0 0 12px}
.md h4{margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--green-pale);color:var(--green-dark);font-size:1.08rem;font-family:'Noto Serif KR','Pretendard',serif}
.md h4:first-child{margin-top:0}
.md ul{margin:0 0 12px 22px}
.md li{margin-bottom:4px}
.md b{color:var(--green-dark)}

.toolbar{text-align:center;margin:0 0 30px}
.toolbar button{background:#fff;color:var(--green);border:1.5px solid var(--green);border-radius:9px;padding:9px 20px;font-size:.86rem;font-weight:600;cursor:pointer;font-family:inherit;margin:0 5px}
.toolbar button:hover{background:var(--green);color:#fff}
.msg{display:none;text-align:center;font-size:.85rem;color:var(--green-dark);margin-top:10px}

.gate{max-width:560px;margin:70px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 30px}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:.82rem;color:var(--sub)}
@media print{
  header,.toolbar,footer,.no-print{display:none!important}
  body{background:#fff}
  .cover{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper{border:none;margin:0;padding:20px 0}
}
</style>
</head>
<body>
<div id="sk-notice" style="position:sticky;top:0;z-index:9999;background:#fff4d6;color:#5a3d00;border-bottom:1px solid #e8c97a;padding:10px 16px;font:14px/1.5 sans-serif;text-align:center">이 사이트의 로그인·신청·게시 기능은 사교원 통합사이트 개편(2026-10)으로 잠시 멈춰 있습니다. 문의는 <a href="https://sakyowon.co.kr/#/contact" style="color:#8a5a00;font-weight:600">사교원 홈페이지 문의</a>로 주세요.</div>


<header>
  <div class="wrap">
    <div class="brand serif"><a href="index.html">사교원 사회혁신팀러닝</a></div>
    <div class="no-print"><a href="#" id="backLink">팀 공간으로 ←</a></div>
  </div>
</header>

<div class="gate" id="gate" style="display:none">
  <div style="font-size:2rem">📊</div>
  <h1 class="serif" style="font-size:1.2rem;margin:10px 0 8px" id="gateTitle">보고서를 찾을 수 없습니다</h1>
  <p style="font-size:.9rem;color:var(--sub)" id="gateMsg">팀 전용 링크로 접속했는지 확인해 주세요.</p>
</div>

<div id="app" style="display:none">
  <div class="cover">
    <div class="wrap">
      <div class="label">TEAM LEARNING REPORT</div>
      <h1 class="serif" id="rTitle"></h1>
      <div class="team" id="rTeam"></div>
      <div class="date" id="rDate"></div>
    </div>
  </div>
  <main class="wrap">
    <div class="paper">
      <div class="md" id="rContent"></div>
    </div>
    <div class="toolbar no-print">
      <button onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
      <button onclick="copyLink()">📋 보고페이지 링크 복사</button>
      <div class="msg" id="copyMsg"></div>
    </div>
  </main>
</div>

<footer>사회혁신교육원 사회적협동조합</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB_URL = 'https://gklecgujcoznxyvywnyu.supabase.co';
var SB_KEY = 'sb_publishable_gedQpfHqmnd1hlGNnrglLw_n5b3f3YN';
var sb = window.supabase.createClient(SB_URL, SB_KEY);
var TOKEN = new URLSearchParams(location.search).get('t') || '';

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtD(iso){
  if(!iso) return '';
  var d = new Date(iso);
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear() + '. ' + p(d.getMonth()+1) + '. ' + p(d.getDate()) + '.';
}
function mdLite(s){
  var lines = esc(s).split(/\r?\n/), out = [], inUl = false;
  function closeUl(){ if(inUl){ out.push('</ul>'); inUl = false; } }
  for(var i=0;i<lines.length;i++){
    var ln = lines[i];
    var bold = function(t){ return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); };
    if(/^#{1,4}\s*/.test(ln)){ closeUl(); out.push('<h4>' + bold(ln.replace(/^#{1,4}\s*/,'')) + '</h4>'); }
    else if(/^[-·•]\s+/.test(ln)){ if(!inUl){ out.push('<ul>'); inUl = true; } out.push('<li>' + bold(ln.replace(/^[-·•]\s+/,'')) + '</li>'); }
    else if(ln.trim() === ''){ closeUl(); }
    else { closeUl(); out.push('<p>' + bold(ln) + '</p>'); }
  }
  closeUl();
  return out.join('');
}
function copyLink(){
  var text = location.href;
  var m = document.getElementById('copyMsg');
  function done(){ m.style.display = 'block'; m.textContent = '링크가 복사되었습니다.'; }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); } catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); }
  else { fallback(); }
}

async function init(){
  document.getElementById('backLink').href = 'team.html?t=' + encodeURIComponent(TOKEN);
  if(!TOKEN){ document.getElementById('gate').style.display = 'block'; return; }
  var res = await sb.rpc('tl_get_report', { p_token: TOKEN });
  if(res.error || !res.data || !res.data.length){
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gateTitle').textContent = '아직 발행된 보고서가 없습니다';
    document.getElementById('gateMsg').innerHTML = '팀러닝이 끝나면 종합요약 보고페이지가 여기에 발행됩니다.<br><a href="team.html?t=' + encodeURIComponent(esc(TOKEN)) + '">← 팀 공간으로 돌아가기</a>';
    return;
  }
  var r = res.data[0];
  document.getElementById('app').style.display = 'block';
  document.getElementById('rTitle').textContent = r.title || (r.team_name + ' 팀러닝 최종 보고');
  document.getElementById('rTeam').textContent = r.team_name + (r.topic ? ' · ' + r.topic : '');
  document.getElementById('rDate').textContent = fmtD(r.published_at) + ' 발행 · 사회혁신교육원';
  document.getElementById('rContent').innerHTML = mdLite(r.content);
  document.title = (r.title || r.team_name + ' 최종 보고') + ' — 사교원 사회혁신팀러닝';
}
init();
</script>
</body>
</html>
